# Runtime settings for fifastreet3.exe. Copied next to the exe as fifastreet3.toml by tools/iterate.ps1.
#
# Stage A (1:1) baseline: only what the game needs to run as on the console. Any setting added
# later to fix a difference gets a comment saying what it fixes and how it was confirmed.

# Since SDK 0.10 the Xenos GPU emulation is a plugin; without this the game starts with no GPU.
gpu_plugin = 'xenos'
game_data_root = 'game'

# Real 60 Hz vblanks. With vsync off the runtime fires vblank at 1000 Hz and a game that paces
# on vblank runs uncapped (Skate 1's finding).
vsync = true

# Renderer: Vulkan with exact EDRAM emulation (fragment shader interlock). Checked 2026-11-23
# against Xbox 360 footage (youtube.com/watch?v=2hWaR0zAdfk) with tests/input/match_quick.txt:
# - player and fence shadows on the court only appear with the FSI render-target path (D3D12 host
#   RTs, D3D12 ROV and Vulkan host RTs all lose them; so do Xenia Canary/Edge);
# - players are washed out and flat on D3D12 (also in the Xenia Canary report), correct on Vulkan.
gpu_backend = 'vulkan'
render_target_path_vulkan = 'fsi'

# Video mode the game reads (VdQueryVideoMode): 1080p, as a 360 set to 1080p output. FIFA Street 3
# renders natively at 1920x1080 then (Digital Foundry; Xenia report #2154). Owner's choice, 2026-11-23.
resolution = '1080p'

# GPU: the integrated AMD Radeon is the 60 FPS baseline (then the Steam Deck), not the RTX 4090.
# Index from the log's "Available Vulkan physical devices" list on this PC: 0 = RTX 4090, 1 = AMD.
vulkan_device = 1

# Every 2 s: "[frame stats] N fps, avg, worst, >33ms, frontbuffer WxH" in the log.
log_frame_stats = true

# The console's own resolution: the SDK defaults to 2x.
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1

# Exclusive fullscreen, as on a console. In a window the desktop compositor makes every
# vkQueuePresentKHR block for a display refresh and the driver holds up the GPU emulation's
# submissions meanwhile: RTX 4090, 1080p match, 29 FPS windowed vs a locked 60 fullscreen (2026-11-23).
fullscreen = true
log_level = 'info'
show_fps_counter = false
