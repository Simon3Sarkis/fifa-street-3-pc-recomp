# Runtime settings for fifastreet3.exe. Copied next to the exe as fifastreet3.toml by tools/iterate.ps1.
#
# Stage A (1:1) baseline: only what the game needs to run as on the console. Any setting added
# later to fix a difference gets a comment saying what it fixes and how it was confirmed.

# Since SDK 0.10 the Xenos GPU emulation is a plugin; without this the game starts with no GPU.
gpu_plugin = 'xenos'
game_data_root = 'game'

# Real 60 Hz vblanks. With vsync off the runtime fires vblank at 1000 Hz and a game that paces
# on vblank runs uncapped (Skate 1's finding).
vsync = true

# Renderer: Vulkan, host render targets. Checked against Xbox 360 footage (youtube 2hWaR0zAdfk and
# other IGN clips): Vulkan draws the player/fence/ball shadows and the correct player shading on both
# render-target paths (D3D12 washes the players out; an earlier note that Vulkan host RTs lose the
# shadows was a misreading of frames where players stood in shade - corrected 2026-11-23). All 7
# arenas compared host vs FSI on the PC: visually equivalent. Host is the faster path on the Steam
# Deck (720p match 44.9 vs 34.3 FPS); FSI ('fsi', exact EDRAM) stays available for comparisons.
gpu_backend = 'vulkan'
render_target_path_vulkan = 'host'

# Video mode the game reads (VdQueryVideoMode): 720p, as a 360 set to 720p output. The baseline target
# is the Steam Deck at 1280x720, locked 60 FPS (owner, 2026-11-23). The game renders native 1080p when
# set to 1080p (Digital Foundry; Xenia report #2154): `--resolution=1080p` for that.
resolution = '720p'

# GPU emulation work cuts for the Steam Deck (2026-11-23). Each was checked 1:1 by freezing a match
# under the pause menu (the scene keeps rendering), snapping it, switching the option on mid-run and
# snapping again: pixel-identical (tests/input/pause_ab*.txt, tools/imgdiff.py).
# - Skip the shared memory barrier (which ends the render pass) around the game's GPU skinning draws
#   unless a draw really reads or overwrites memory written since the last barrier: render passes
#   per frame 182 -> 82 in the paused scene.
vulkan_memexport_barrier_elision = true
# - Resolve single-sampled 32bpp targets in one dispatch, defer resolve clears into the next render
#   pass, reuse unchanged texture descriptor sets.
vulkan_direct_resolve_fast32 = true
vulkan_deferred_resolve_clears = true
vulkan_reuse_transient_texture_descriptors = true

# Controllers: enumerate devices at most once a second instead of on every input call (the game asks
# for all four users every frame). Under Proton each enumeration is a blocking device I/O round trip
# per pad slot: the game's main thread spent ~65% of its time there on the Steam Deck. Pad state is
# still read fresh on every call; a pad plugged in shows up within a second.
input_device_refresh_ms = 1000

# CPU clocks on the Steam Deck: its CPU picks each core's clock from how busy that core looks
# (amd-pstate-epp, balance_performance). When the GPU command thread sleeps through its per-frame
# wait for the game, a frame that slips once to 30 FPS leaves every thread half idle, the clocks drop
# to ~2.35 GHz and the game stays at 30 (half of all paused-scene runs, 2026-11-24). Polling through
# the wait (up to 50 ms, longer waits such as loading screens still sleep) keeps that core and the
# clock up: 6 of 6 runs at 57-60 FPS, CPU 3.3 GHz, APU 12-15 W. Under Proton only: on the PC (native
# Windows, NVIDIA) the same long spin made vkQueueSubmit block ~12 ms a frame (40 FPS); the PC keeps the
# default 2 ms spin and a locked 60.
wait_reg_mem_spin_wine_us = 50000

# Native Linux build: give the GPU command thread CPU 0 and keep the game's other threads off that core
# (CPUs 0 and 1). At 10 W on the Deck the missed frames were the same work taking twice as long - the
# thread preempted or sharing its core; interleaved A/B: missed frames per match 10/11/9 -> 5/2/2
# (99.7% -> 99.9% of frames on time). No effect on Windows.
gpu_command_thread_cpu = 0

# UI ticks from a high-resolution timer at the display rate: Proton emulates WaitForVBlank by polling,
# which kept the UI thread at ~40% of a core on the Deck (now ~5%; paused-scene benchmark 59.6 +- 0.6).
dxgi_ui_tick_timer = true

# Audio: fold the game's 5.1 mix to stereo ourselves (centre/surrounds -3 dB, LFE dropped, normalised).
# A docked Steam Deck's stereo HDMI sink reports 6 channels to SDL; passing 5.1 through left the
# downmix to PipeWire, which came out ~5 dB hotter with clipping and a bass-heavy balance (recorded and
# compared with the Proton build, 2026-11-24). Set false for a real 5.1 speaker setup.
audio_force_stereo = true
# Ask the audio device for 256-sample periods (one guest audio frame, 5.3 ms). Natively on the Deck
# PipeWire otherwise ran the stream at 1024: each callback took four guest frames at once, the XMA
# decoder (polling every 2 ms) fell behind inside the burst and the game played ~100 empty 5 ms frames
# a minute (audible crackle; Proton ran at 256 and had none). With 256: 0 on the Deck and on the PC.
audio_device_sample_frames = 256

# GPU: automatic (the Deck has one). On a PC with two GPUs, `vulkan_device = N` picks one; the log
# lists them under "Available Vulkan physical devices".

# Every 2 s: "[frame stats] N fps, avg, worst, >33ms, frontbuffer WxH" in the log.
log_frame_stats = true

# The console's own resolution: the SDK defaults to 2x.
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1

# Exclusive fullscreen, as on a console. In a window the desktop compositor makes every
# vkQueuePresentKHR block for a display refresh and the driver holds up the GPU emulation's
# submissions meanwhile: RTX 4090, 1080p match, 29 FPS windowed vs a locked 60 fullscreen (2026-11-23).
fullscreen = true
log_level = 'info'
show_fps_counter = false
